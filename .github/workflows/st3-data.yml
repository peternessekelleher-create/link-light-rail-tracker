# Weekly refresh of the station, bus-connection and bus-reach data.
# Downloads the King County Metro, Sound Transit, Community Transit and Pierce
# Transit GTFS, rebuilds the small files in data/ (connections.json,
# routes.geojson, reach/<station>.json, the ST3 station points) and commits
# them if anything changed. The site only reads those committed files; the
# browser never loads raw GTFS.
#
# Reach and walk sheds run one station per worker process across the
# runner's cores. Reach takes under a minute; walk sheds (OpenStreetMap
# Washington extract, about 365 MB) take about 10 minutes on 4 cores.
name: Transit data

on:
  schedule:
    - cron: "23 12 * * 1" # Mondays 12:23 UTC (5:23 am Pacific in summer)
  workflow_dispatch:
    inputs:
      rebuild_anchors:
        description: Re-query OpenStreetMap for the ST3 station anchor intersections
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: transit-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install walk-shed dependencies
        run: pip install -r requirements.txt

      - name: Build data
        run: python -m pipeline.build ${{ inputs.rebuild_anchors && '--rebuild-anchors' || '' }}

      - name: Commit changes
        id: commit
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Weekly transit data refresh"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Vercel may not deploy commits made by the Actions bot. If a deploy hook
      # is saved as the VERCEL_DEPLOY_HOOK repository secret, call it.
      - name: Trigger Vercel deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" > /dev/null && echo "Deploy hook called."; else echo "No VERCEL_DEPLOY_HOOK secret; relying on Vercel's Git integration."; fi
