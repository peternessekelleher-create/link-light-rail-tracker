<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link Light Rail Tracker</title>
  <meta name="description" content="Live Sound Transit Link trains, the planned ST3 stations, connecting buses and how far you can get by bus in 15 and 30 minutes from any station.">
  <link rel="preconnect" href="https://api.mapbox.com">
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js" defer></script>
  <script src="app.js" type="module"></script>
</head>
<body>
  <div id="map" role="region" aria-label="Map of Link light rail lines"></div>

  <!-- Status chips, top center -->
  <div class="chips">
    <p id="status" class="chip-status" role="status">Loading Map…</p>
    <p id="live-status" class="chip-status live" role="status"></p>
    <p id="live-banner" class="chip-status banner" role="alert" hidden>Live Data Temporarily Unavailable</p>
    <p id="pin-chip" class="chip-status pin" role="status" hidden></p>
  </div>

  <!-- Phone width: the panels open as drawers from these buttons -->
  <button class="drawer-btn left" type="button" data-drawer="controls" aria-controls="controls" aria-expanded="false">Layers</button>
  <button class="drawer-btn right" type="button" data-drawer="headways" aria-controls="headways" aria-expanded="false">Headways</button>

  <aside id="controls" class="panel panel-left" aria-label="Map layers">
    <div class="panel-head">
      <h1>Link Light Rail</h1>
      <button class="close" type="button" data-close aria-label="Close layers">×</button>
    </div>

    <section class="group" aria-labelledby="live-name">
      <div class="group-head">
        <button type="button" class="collapse" aria-expanded="true" aria-controls="live-body">
          <span class="chev" aria-hidden="true"></span><span id="live-name" class="group-name">Live Link (Existing)</span>
        </button>
        <label class="switch"><input type="checkbox" id="live-toggle" checked><span class="track" aria-hidden="true"></span><span class="sr-only">Show Live Link</span></label>
      </div>
      <div id="live-body" class="group-body">
        <div id="line-toggles"></div>
        <label class="switch"><input type="checkbox" id="ghost-toggle" checked><span class="track" aria-hidden="true"></span><span>Ghost Trains</span></label>
        <label class="switch"><input type="checkbox" id="tag-toggle" checked><span class="track" aria-hidden="true"></span><span>Delay Tags</span></label>
        <ul class="legend-trains">
          <li><span class="dot live"></span>Live Train</li>
          <li><span class="dot ghost"></span>Scheduled Position</li>
          <li><span class="dot fill" aria-hidden="true"></span>Fill = Est. Crowding</li>
        </ul>
        <p class="note" data-note="crowding"></p>
      </div>
    </section>

    <div class="divider"></div>

    <section class="group" aria-labelledby="st3-name">
      <div class="group-head">
        <button type="button" class="collapse" aria-expanded="true" aria-controls="st3-body">
          <span class="chev" aria-hidden="true"></span><span id="st3-name" class="group-name">Sound Transit 3 – Future Network</span>
        </button>
        <label class="switch"><input type="checkbox" id="st3-toggle" checked><span class="track" aria-hidden="true"></span><span class="sr-only">Show Sound Transit 3 Future Network</span></label>
      </div>
      <div id="st3-body" class="group-body"><p class="muted">Loading…</p></div>
    </section>

    <p class="methods-link"><button type="button" class="link small-link" data-open-methods>How this works</button></p>
  </aside>

  <aside id="headways" class="panel panel-right" aria-label="Headways">
    <div class="panel-head">
      <button id="headways-toggle" class="collapse" type="button" aria-expanded="true" aria-controls="headway-body">
        <h2>Headways</h2><span class="chev" aria-hidden="true"></span>
      </button>
      <button class="close" type="button" data-close aria-label="Close headways">×</button>
    </div>
    <div id="headway-body">
      <p class="hw-note">Average Time Between Trains</p>
      <div id="headway-rows"></div>
      <p id="headway-updated" class="hw-footer"></p>
    </div>
  </aside>

  <!-- Bus reach: time picker and summary, bottom-left (top on phones) -->
  <aside id="reach-box" class="reach-box" aria-label="Bus reach"></aside>

  <aside id="methods" class="card methods" role="dialog" aria-labelledby="methods-title" hidden>
    <div class="card-head">
      <h2 id="methods-title">How this works</h2>
      <button class="close" type="button" data-close-methods aria-label="Close how this works">×</button>
    </div>
    <div class="card-body methods-body" data-body><p class="muted">Loading…</p></div>
  </aside>

  <aside id="station-card" class="card" role="dialog" aria-labelledby="station-card-title" hidden>
    <div class="card-head">
      <h2 id="station-card-title"></h2>
      <button class="close" type="button" data-close-card aria-label="Close station">×</button>
    </div>
    <div class="card-body" data-body></div>
  </aside>
</body>
</html>
